server.servlet.encoding.enabled=true
server.servlet.encoding.charset=utf-8

# 1. Database 접속 설정 (본인의 MySQL 포트, DB명, 계정에 맞춰 수정)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/globalin?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=jeon
spring.datasource.password=12341234

# 2. JPA & Hibernate 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 3. Thymeleaf 캐시 끄기 (개발용)
spring.thymeleaf.cache=false