<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>근태관리 시스템 - 근태관리</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; background-color: #f4f6f9; }

    header { background-color: #1a253f; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
    header .logo { font-size: 20px; font-weight: bold; }
    header .user-info { font-size: 14px; }
    header .user-info a { color: #aaa; margin-left: 15px; text-decoration: none; }

    .container { display: flex; flex: 1; }

    nav { width: 220px; background-color: #2c3e50; color: white; padding-top: 20px; }
    nav ul { list-style: none; }
    nav ul li a { display: block; padding: 15px 25px; color: #bdc3c7; text-decoration: none; font-size: 15px; }
    nav ul li.active a, nav ul li a:hover { background-color: #3f51b5; color: white; font-weight: bold; }

    /* 전자결재 서브메뉴 스타일 (기존 스타일 교체) */
    nav ul li .sub-menu {
      display: none !important; /* 기본 상태 강제 숨김 */
      list-style: none;
      background-color: #22313f;
      padding: 5px 0;
    }

    /* open 클래스가 추가되었을 때만 펼침 */
    nav ul li.open .sub-menu {
      display: block !important;
    }

    nav ul li .sub-menu li a {
      padding: 10px 10px 10px 40px !important;
      font-size: 13px;
      color: #a0aec0;
      background-color: transparent !important; /* 선택 배경색 간섭 방지 */
    }

    nav ul li .sub-menu li a:hover {
      color: white !important;
      background-color: #1e2b37 !important;
    }

    main { flex: 1; padding: 30px; overflow-y: auto; }

    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .page-title { font-size: 22px; font-weight: bold; }
    .month-subtext { color: #888; font-size: 14px; }

    /* 요약 카드 5개 */
    .summary-cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; margin-bottom: 25px; }
    .card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
    .card-title { font-size: 13px; color: #666; margin-bottom: 10px; }
    .card-value { font-size: 22px; font-weight: bold; color: #2c3e50; }

    /* 주단위 캘린더 */
    .calendar-card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.03); margin-bottom: 25px; }
    .week-nav { display: flex; justify-content: center; align-items: center; gap: 40px; margin-bottom: 15px; font-size: 18px; font-weight: bold; }
    .arrow-btn { background: none; border: none; font-size: 18px; cursor: pointer; color: #3f51b5; }

    .week-grid { display: grid; grid-template-columns: repeat(7, 1fr); border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden; }
    .day-header { background: #f8fafc; padding: 10px; text-align: center; font-weight: bold; font-size: 13px; border-bottom: 1px solid #e2e8f0; }
    .day-header.sun { color: #e74c3c; }
    .day-header.sat { color: #3498db; }

    .day-cell { min-height: 110px; padding: 12px; border-right: 1px solid #e2e8f0; background: white; position: relative; }
    .day-cell:last-child { border-right: none; }
    .day-num { font-size: 14px; font-weight: bold; margin-bottom: 10px; }
    .day-cell.sun .day-num { color: #e74c3c; }
    .day-cell.sat .day-num { color: #3498db; }
    .day-cell.today { background-color: #f0f4ff; }

    .time-text { font-size: 12px; color: #666; margin-bottom: 8px; }

    /* 다이내믹 배지 */
    .status-badge { display: inline-block; color: white; font-size: 11px; padding: 3px 8px; border-radius: 12px; font-weight: bold; }

    /* 휴가 신청 내역 */
    .leave-card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
    .leave-card h4 { font-size: 16px; margin-bottom: 15px; }
    .empty-text { text-align: center; padding: 30px; color: #888; font-size: 14px; }
  </style>
</head>
<body>

<header>
  <div class="logo">근태관리 시스템</div>
  <div class="user-info">
    <span th:text="${loginUser.empName} + ' 님'">OOO 님</span>
    <a href="#">마이페이지</a>
    <a href="/logout">로그아웃</a>
  </div>
</header>

<div class="container">
  <nav>
    <ul>
      <li><a href="/employee/main">㗊 대시보드</a></li>
      <li><a href="/employee/schedule">🕒 일정관리</a></li>
      <li class="active"><a href="/employee/attendance">📅 근태관리</a></li>
      <li id="approvalMenuItem">
        <a href="javascript:void(0);" onclick="toggleApprovalMenu(event)">📄 전자결재</a>
        <ul class="sub-menu">
          <li><a href="/employee/approval/leave">- 휴가 신청</a></li>
          <li><a href="/employee/approval/overtime">- 시간외수당 신청</a></li>
          <li><a href="/employee/approval/pds">- 자료실</a></li>
        </ul>
      </li>
      <li><a href="#">☑️ 결재 상태</a></li>
    </ul>
  </nav>

  <main>
    <div class="page-header">
      <div class="page-title">근태관리</div>
      <div class="month-subtext" id="monthSubtext">2026년 9월</div>
    </div>

    <!-- 요약 카드 5개 -->
    <div class="summary-cards">
      <div class="card">
        <div class="card-title">이번 달 근무일</div>
        <div class="card-value" id="workDays">0 / 0일</div>
      </div>
      <div class="card">
        <div class="card-title">총 근무시간</div>
        <div class="card-value" id="totalWorkTime">0:00</div>
      </div>
      <div class="card">
        <div class="card-title">누적 초과근무</div>
        <div class="card-value" id="totalOvertime">0:00</div>
      </div>
      <div class="card">
        <div class="card-title">지각 · 결근</div>
        <div class="card-value" id="tardyAndAbsent">0 · 0</div>
      </div>
      <div class="card">
        <div class="card-title">잔여 연차</div>
        <div class="card-value" id="remainLeave">0일</div>
      </div>
    </div>

    <!-- 주단위 캘린더 -->
    <div class="calendar-card">
      <div class="week-nav">
        <button class="arrow-btn" onclick="moveWeek(-7)">◄</button>
        <span id="weekLabel">9월 3주</span>
        <button class="arrow-btn" onclick="moveWeek(7)">►</button>
      </div>

      <div class="week-grid" id="weekGrid">
        <div class="day-header sun">일</div>
        <div class="day-header">월</div>
        <div class="day-header">화</div>
        <div class="day-header">수</div>
        <div class="day-header">목</div>
        <div class="day-header">금</div>
        <div class="day-header sat">토</div>
        <!-- 날짜 셀 동적 추가 -->
      </div>
    </div>

    <!-- 휴가 신청 내역 -->
    <div class="leave-card">
      <h4>휴가 신청 내역</h4>
      <div class="empty-text">휴가 신청 내역이 없습니다.</div>
    </div>
  </main>
</div>

<script>
  let currentPivotDate = new Date();

  window.onload = function() {
    loadAttendanceData(currentPivotDate);
  };

  function loadAttendanceData(date) {
    const formattedDate = date.toISOString().split('T')[0];

    fetch(`/employee/attendance/api/summary?date=${formattedDate}`)
    .then(res => res.json())
    .then(data => {
      document.getElementById('monthSubtext').innerText = data.monthLabel;
      document.getElementById('workDays').innerText = data.workDays;
      document.getElementById('totalWorkTime').innerText = data.totalWorkTime;
      document.getElementById('totalOvertime').innerText = data.totalOvertime;
      document.getElementById('tardyAndAbsent').innerText = data.tardyAndAbsent;
      document.getElementById('remainLeave').innerText = `${data.remainLeave}일`;
      document.getElementById('weekLabel').innerText = data.weekLabel;

      renderWeekGrid(data.weeklyAttendance);
    });
  }

  function renderWeekGrid(weeklyAttendance) {
    const grid = document.getElementById('weekGrid');
    while (grid.children.length > 7) {
      grid.removeChild(grid.lastChild);
    }

    weeklyAttendance.forEach((item, index) => {
      const cell = document.createElement('div');
      let dayClass = 'day-cell';
      if (index === 0) dayClass += ' sun';
      if (index === 6) dayClass += ' sat';
      if (item.today) dayClass += ' today';
      cell.className = dayClass;

      let html = `<div class="day-num">${item.dayNum}</div>`;
      html += `<div class="time-text">${item.timeRange}</div>`;

      // 동적 배지 생성 (지각, 정상출근, 결근, 휴가)
      if (item.badgeText && item.badgeColor) {
        html += `<span class="status-badge" style="background-color: ${item.badgeColor};">${item.badgeText}</span>`;
      }

      cell.innerHTML = html;
      grid.appendChild(cell);
    });
  }

  function moveWeek(days) {
    currentPivotDate.setDate(currentPivotDate.getDate() + days);
    loadAttendanceData(currentPivotDate);
  }

  function toggleApprovalMenu(event) {
    // 1. 링크 기본 동작(# 이동) 방지
    event.preventDefault();
    event.stopPropagation();

    // 2. 전자결재 li 태그 요소 가져오기
    const menuItem = document.getElementById('approvalMenuItem');

    // 3. open 클래스 토글 (켜기/끄기)
    if (menuItem) {
      menuItem.classList.toggle('open');
    }
  }
</script>
</body>
</html>
