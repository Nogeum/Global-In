<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>근태관리 시스템 - 대시보드</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; background-color: #f4f6f9; }

    /* 상단 헤더 */
    header { background-color: #1a253f; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
    header .logo { font-size: 20px; font-weight: bold; }
    header .user-info { font-size: 14px; }
    header .user-info a { color: #aaa; margin-left: 15px; text-decoration: none; }

    /* 메인 컨테이너 */
    .container { display: flex; flex: 1; }

    /* 사이드바 */
    nav { width: 220px; background-color: #2c3e50; color: white; padding-top: 20px; }
    nav ul { list-style: none; }
    nav ul li a { display: block; padding: 15px 25px; color: #bdc3c7; text-decoration: none; font-size: 15px; }
    nav ul li.active a, nav ul li a:hover { background-color: #34495e; color: white; font-weight: bold; }

    /* 전자결재 서브메뉴 스타일 (기존 스타일 교체) */
    nav ul li .sub-menu {
      display: none !important; /* 기본 상태 강제 숨김 */
      list-style: none;
      background-color: #22313f;
      padding: 5px 0;
    }

    /* open 클래스가 추가되었을 때만 펼침 */
    nav ul li.open .sub-menu {
      display: block !important;
    }

    nav ul li .sub-menu li a {
      padding: 10px 10px 10px 40px !important;
      font-size: 13px;
      color: #a0aec0;
      background-color: transparent !important; /* 선택 배경색 간섭 방지 */
    }

    nav ul li .sub-menu li a:hover {
      color: white !important;
      background-color: #1e2b37 !important;
    }

    /* 본문 대시보드 영역 */
    main { flex: 1; padding: 30px; }
    .card-group { display: flex; gap: 20px; margin-bottom: 30px; }
    .card { flex: 1; background: white; border-radius: 8px; padding: 25px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: center; }
    .card h3 { font-size: 15px; color: #666; margin-bottom: 15px; text-align: left; }

    /* 출퇴근 카운터 */
    .time-box { display: flex; justify-content: space-around; margin-bottom: 20px; }
    .time-item p { font-size: 13px; color: #888; margin-bottom: 5px; }
    .time-item span { font-size: 22px; font-weight: bold; color: #333; }

    /* 버튼 스타일 */
    .btn-attendance { width: 100%; padding: 10px; border: none; border-radius: 5px; background-color: #3f51b5; color: white; font-size: 16px; cursor: pointer; }
    .btn-attendance:hover { background-color: #303f9f; }
    .btn-disabled { background-color: #ccc !important; cursor: not-allowed; }

    .stat-value { font-size: 32px; font-weight: bold; color: #111; margin-top: 10px; }

    /* 공지사항 테이블/리스트 */
    .notice-card { background: white; border-radius: 8px; padding: 25px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .notice-card h2 { font-size: 18px; margin-bottom: 20px; }
    .notice-list { list-style: none; }
    .notice-list li { padding: 12px 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; font-size: 14px; }
  </style>
</head>
<body>

<!-- 상단 헤더 -->
<header>
  <div class="logo">근태관리 시스템</div>
  <div class="user-info">
    <span th:text="${dashboard.empName} + ' 님'">홍길동 님</span>
    <a href="#">마이페이지</a>
    <a href="/logout">로그아웃</a>
  </div>
</header>

<div class="container">
  <!-- 사이드바 메뉴 (5개 탭) -->
  <nav>
    <ul>
      <li class="active"><a href="/employee/main">㗊 대시보드</a></li>
      <li><a href="/employee/schedule">🕒 일정관리</a></li>
      <li><a href="/employee/attendance">📅 근태관리</a></li>
      <li id="approvalMenuItem">
        <a href="javascript:void(0);" onclick="toggleApprovalMenu(event)">📄 전자결재</a>
        <ul class="sub-menu">
          <li><a href="/employee/approval/leave">- 휴가 신청</a></li>
          <li><a href="/employee/approval/overtime">- 시간외수당 신청</a></li>
          <li><a href="/employee/approval/pds">- 자료실</a></li>
        </ul>
      </li>
      <li><a href="#">☑️ 결재 상태</a></li>
    </ul>
  </nav>

  <!-- 대시보드 콘텐츠 -->
  <main>
    <div class="card-group">
      <!-- 1. 금일 출퇴근 현황 -->
      <div class="card">
        <h3>금일 출퇴근 현황</h3>
        <div class="time-box">
          <div class="time-item">
            <p>출근</p>
            <span th:text="${dashboard.checkInTime}">--:--</span>
          </div>
          <div class="time-item">
            <p>퇴근</p>
            <span th:text="${dashboard.checkOutTime}">--:--</span>
          </div>
        </div>

        <!-- 버튼 상태 처리 -->
        <button th:if="${!dashboard.isCheckedIn}" class="btn-attendance" onclick="checkIn()">출근</button>
        <button th:if="${dashboard.isCheckedIn && !dashboard.isCheckedOut}" class="btn-attendance" onclick="checkOut()">퇴근</button>
        <button th:if="${dashboard.isCheckedIn && dashboard.isCheckedOut}" class="btn-attendance btn-disabled" disabled>근무 완료</button>
      </div>

      <!-- 2. 잔여 연차 -->
      <div class="card">
        <h3 th:text="${#temporals.format(#temporals.createNow(), 'yyyy')} + '년 잔여 연차'">2026년 잔여 연차</h3>
        <div class="stat-value" th:text="${dashboard.remainLeaveDays} + '일'">0일</div>
      </div>

      <!-- 3. 결제 대기건수 -->
      <div class="card">
        <h3>결제 대기건수</h3>
        <div class="stat-value" th:text="${dashboard.pendingApprovalCount} + ' 건'">0 건</div>
      </div>
    </div>

    <!-- 4. 사내 공지사항 -->
    <div class="notice-card">
      <h2>사내 공지사항</h2>
      <ul class="notice-list">
        <li th:each="notice : ${dashboard.notices}">
          <span th:text="'• ' + ${notice.content}">• 공지사항 내용</span>
          <span th:text="'(' + ${notice.date} + ')'" style="color: #888;">(09/01)</span>
        </li>
        <li th:if="${#lists.isEmpty(dashboard.notices)}">
          <span>등록된 공지사항이 없습니다.</span>
        </li>
      </ul>
    </div>
  </main>
</div>

<script>
  function checkIn() {
    if (confirm('출근 등록을 하시겠습니까?')) {
      fetch('/employee/api/check-in', { method: 'POST' })
      .then(res => res.text())
      .then(msg => {
        alert(msg);
        location.reload();
      });
    }
  }

  function checkOut() {
    if (confirm('퇴근 등록을 하시겠습니까?')) {
      fetch('/employee/api/check-out', { method: 'POST' })
      .then(res => res.text())
      .then(msg => {
        alert(msg);
        location.reload();
      });
    }
  }
  function toggleApprovalMenu(event) {
    // 1. 링크 기본 동작(# 이동) 방지
    event.preventDefault();
    event.stopPropagation();

    // 2. 전자결재 li 태그 요소 가져오기
    const menuItem = document.getElementById('approvalMenuItem');

    // 3. open 클래스 토글 (켜기/끄기)
    if (menuItem) {
      menuItem.classList.toggle('open');
    }
  }
</script>
</body>
</html>
