<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>근태관리 시스템 - 일정관리</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; background-color: #f4f6f9; }

    header { background-color: #1a253f; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
    header .logo { font-size: 20px; font-weight: bold; }
    header .user-info { font-size: 14px; }
    header .user-info a { color: #aaa; margin-left: 15px; text-decoration: none; }

    .container { display: flex; flex: 1; }

    nav { width: 220px; background-color: #2c3e50; color: white; padding-top: 20px; }
    nav ul { list-style: none; }
    nav ul li a { display: block; padding: 15px 25px; color: #bdc3c7; text-decoration: none; font-size: 15px; }
    nav ul li.active a, nav ul li a:hover { background-color: #3f51b5; color: white; font-weight: bold; }

    /* 전자결재 서브메뉴 스타일 (기존 스타일 교체) */
    nav ul li .sub-menu {
      display: none !important; /* 기본 상태 강제 숨김 */
      list-style: none;
      background-color: #22313f;
      padding: 5px 0;
    }

    /* open 클래스가 추가되었을 때만 펼침 */
    nav ul li.open .sub-menu {
      display: block !important;
    }

    nav ul li .sub-menu li a {
      padding: 10px 10px 10px 40px !important;
      font-size: 13px;
      color: #a0aec0;
      background-color: transparent !important; /* 선택 배경색 간섭 방지 */
    }

    nav ul li .sub-menu li a:hover {
      color: white !important;
      background-color: #1e2b37 !important;
    }

    main { flex: 1; padding: 30px; }
    .calendar-card { background: white; border-radius: 8px; padding: 25px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

    /* 달력 헤더 */
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .month-picker { display: flex; align-items: center; gap: 15px; font-size: 22px; font-weight: bold; }
    .arrow-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #3f51b5; }
    .btn-add { background-color: #3f51b5; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }

    /* 달력 테이블 */
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); border-top: 1px solid #ddd; border-left: 1px solid #ddd; }
    .day-header { background: #fafafa; padding: 10px; text-align: center; font-weight: bold; border-right: 1px solid #ddd; border-bottom: 1px solid #ddd; }
    .day-header.sun { color: #e74c3c; }
    .day-header.sat { color: #3498db; }

    .day-cell { min-height: 100px; padding: 8px; border-right: 1px solid #ddd; border-bottom: 1px solid #ddd; background: white; vertical-align: top; position: relative; }
    .day-number { font-size: 14px; font-weight: bold; margin-bottom: 5px; }
    .day-cell.sun .day-number { color: #e74c3c; }
    .day-cell.sat .day-number { color: #3498db; }

    /* 일정 배지 */
    .schedule-badge { color: white; padding: 3px 6px; border-radius: 4px; font-size: 11px; margin-bottom: 3px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }

    /* 모달 스타일 */
    .modal-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; padding: 30px; border-radius: 12px; width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    .modal-content h3 { margin-bottom: 20px; font-size: 18px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 13px; color: #666; margin-bottom: 5px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }

    /* 색상 선택기 */
    .color-picker { display: flex; gap: 10px; margin-top: 8px; }
    .color-circle { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
    .color-circle.selected { border-color: #333; }

    .modal-buttons { display: flex; gap: 10px; margin-top: 20px; }
    .btn-cancel { flex: 1; padding: 10px; background: #eee; border: none; border-radius: 6px; cursor: pointer; }
    .btn-save { flex: 1; padding: 10px; background: #3f51b5; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

<header>
  <div class="logo">근태관리 시스템</div>
  <div class="user-info">
    <span th:text="${loginUser.empName} + ' 님'">홍길동 님</span>
    <a href="#">마이페이지</a>
    <a href="/logout">로그아웃</a>
  </div>
</header>

<div class="container">
  <nav>
    <ul>
      <li><a href="/employee/main">㗊 대시보드</a></li>
      <li class="active"><a href="/employee/schedule">🕒 일정관리</a></li>
      <li><a href="/employee/attendance">📅 근태관리</a></li>
      <li id="approvalMenuItem">
        <a href="javascript:void(0);" onclick="toggleApprovalMenu(event)">📄 전자결재</a>
        <ul class="sub-menu">
          <li><a href="/employee/approval/leave">- 휴가 신청</a></li>
          <li><a href="/employee/approval/overtime">- 시간외수당 신청</a></li>
          <li><a href="/employee/approval/pds">- 자료실</a></li>
        </ul>
      </li>
      <li><a href="#">☑️ 결재 상태</a></li>
    </ul>
  </nav>

  <main>
    <div class="calendar-card">
      <div class="calendar-header">
        <div class="month-picker">
          <button class="arrow-btn" onclick="changeMonth(-1)">◀</button>
          <span id="currentYearMonth">2026-09</span>
          <button class="arrow-btn" onclick="changeMonth(1)">▶</button>
        </div>
        <button class="btn-add" onclick="openModal()">+ 일정 등록</button>
      </div>

      <div class="calendar-grid" id="calendarGrid">
        <div class="day-header sun">일</div>
        <div class="day-header">월</div>
        <div class="day-header">화</div>
        <div class="day-header">수</div>
        <div class="day-header">목</div>
        <div class="day-header">금</div>
        <div class="day-header sat">토</div>
        <!-- 날짜 칸이 JS로 동적 생성됩니다 -->
      </div>
    </div>
  </main>
</div>

<!-- 일정 등록 모달창 -->
<div class="modal-overlay" id="scheduleModal">
  <div class="modal-content">
    <h3>일정 등록</h3>
    <div class="form-group">
      <label>날짜</label>
      <input type="date" id="modalDate">
    </div>
    <div class="form-group">
      <label>일정 선택</label>
      <select id="modalCategory">
        <option value="개인">개인</option>
        <option value="팀 회의">팀 회의</option>
        <option value="외근/출장">외근/출장</option>
        <option value="휴가">휴가</option>
      </select>
    </div>
    <div class="form-group">
      <label>메모</label>
      <textarea id="modalMemo" rows="3" placeholder="내용을 입력하세요"></textarea>
    </div>
    <div class="form-group">
      <label>색상</label>
      <div class="color-picker">
        <div class="color-circle selected" style="background:#e74c3c" data-color="#e74c3c" onclick="selectColor(this)"></div>
        <div class="color-circle" style="background:#e67e22" data-color="#e67e22" onclick="selectColor(this)"></div>
        <div class="color-circle" style="background:#2ecc71" data-color="#2ecc71" onclick="selectColor(this)"></div>
        <div class="color-circle" style="background:#3498db" data-color="#3498db" onclick="selectColor(this)"></div>
        <div class="color-circle" style="background:#9b59b6" data-color="#9b59b6" onclick="selectColor(this)"></div>
        <div class="color-circle" style="background:#1abc9c" data-color="#1abc9c" onclick="selectColor(this)"></div>
      </div>
    </div>
    <div class="modal-buttons">
      <button class="btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn-save" onclick="saveSchedule()">저장</button>
    </div>
  </div>
</div>

<script>
  let currentDate = new Date(2026, 8, 1); // 2026년 9월 기본 설정
  let selectedColor = '#e74c3c';
  let scheduleData = [];

  window.onload = function() {
    renderCalendar();
  };

  function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth(); // 0-indexed
    const formattedYM = `${year}-${String(month + 1).padStart(2, '0')}`;

    document.getElementById('currentYearMonth').innerText = formattedYM;

    // API 로 일정 목록 조회
    fetch(`/employee/schedule/api/list?yearMonth=${formattedYM}`)
    .then(res => res.json())
    .then(data => {
      scheduleData = data;
      buildGrid(year, month);
    });
  }

  function buildGrid(year, month) {
    const grid = document.getElementById('calendarGrid');
    // 이전 날짜 셀 제거 (헤더 7개 유지)
    while (grid.children.length > 7) {
      grid.removeChild(grid.lastChild);
    }

    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();

    // 이전 달 빈칸 fill
    for (let i = 0; i < firstDay; i++) {
      const emptyCell = document.createElement('div');
      emptyCell.className = 'day-cell';
      emptyCell.style.background = '#fcfcfc';
      grid.appendChild(emptyCell);
    }

    // 이번 달 날짜 채우기
    for (let date = 1; date <= lastDate; date++) {
      const cell = document.createElement('div');
      const dayOfWeek = (firstDay + date - 1) % 7;

      let dayClass = 'day-cell';
      if (dayOfWeek === 0) dayClass += ' sun';
      if (dayOfWeek === 6) dayClass += ' sat';
      cell.className = dayClass;

      const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(date).padStart(2, '0')}`;

      cell.innerHTML = `<div class="day-number">${date}</div>`;

      // 해당 날짜의 일정들 바인딩
      const daySchedules = scheduleData.filter(s => s.workDate === dateStr);
      daySchedules.forEach(s => {
        const badge = document.createElement('div');
        badge.className = 'schedule-badge';
        badge.style.backgroundColor = s.color;
        badge.innerText = `${s.category} - ${s.memo}`;
        badge.onclick = (e) => {
          e.stopPropagation();
          if (confirm('해당 일정을 삭제하시겠습니까?')) {
            deleteSchedule(s.schId);
          }
        };
        cell.appendChild(badge);
      });

      grid.appendChild(cell);
    }
  }

  function changeMonth(delta) {
    currentDate.setMonth(currentDate.getMonth() + delta);
    renderCalendar();
  }

  function openModal() {
    const year = currentDate.getFullYear();
    const month = String(currentDate.getMonth() + 1).padStart(2, '0');
    document.getElementById('modalDate').value = `${year}-${month}-17`;
    document.getElementById('scheduleModal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('scheduleModal').style.display = 'none';
  }

  function selectColor(element) {
    document.querySelectorAll('.color-circle').forEach(c => c.classList.remove('selected'));
    element.classList.add('selected');
    selectedColor = element.getAttribute('data-color');
  }

  function saveSchedule() {
    const date = document.getElementById('modalDate').value;
    const category = document.getElementById('modalCategory').value;
    const memo = document.getElementById('modalMemo').value;

    if (!date || !memo) {
      alert('날짜와 메모 내용을 입력해주세요.');
      return;
    }

    const payload = {
      workDate: date,
      category: category,
      memo: memo,
      color: selectedColor
    };

    fetch('/employee/schedule/api/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
    .then(res => res.text())
    .then(msg => {
      alert(msg);
      closeModal();
      renderCalendar();
    });
  }

  function deleteSchedule(schId) {
    fetch(`/employee/schedule/api/delete/${schId}`, { method: 'DELETE' })
    .then(res => res.text())
    .then(msg => {
      alert(msg);
      renderCalendar();
    });
  }
  function toggleApprovalMenu(event) {
    // 1. 링크 기본 동작(# 이동) 방지
    event.preventDefault();
    event.stopPropagation();

    // 2. 전자결재 li 태그 요소 가져오기
    const menuItem = document.getElementById('approvalMenuItem');

    // 3. open 클래스 토글 (켜기/끄기)
    if (menuItem) {
      menuItem.classList.toggle('open');
    }
  }
</script>
</body>
</html>
