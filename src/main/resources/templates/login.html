<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>근태관리 시스템 - 로그인</title>
</head>
<body>
<h2>근태관리 시스템</h2>
<div>
  <label for="loginId">아이디</label><br>
  <input type="text" id="loginId" placeholder="아이디 입력"><br><br>

  <label for="loginPw">비밀번호</label><br>
  <input type="password" id="loginPw" placeholder="비밀번호 입력"><br><br>

  <button type="button" onclick="login()">로그인</button>
</div>

<script>
  function login() {
    const loginId = document.getElementById('loginId').value;
    const loginPw = document.getElementById('loginPw').value;

    if (!loginId || !loginPw) {
      alert('아이디와 비밀번호를 모두 입력해주세요.');
      return;
    }

    fetch('/api/login', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        loginId: loginId,
        loginPw: loginPw
      })
    })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        // 관리자(/admin/main) 또는 일반 직원(/employee/main)으로 리다이렉트
        location.href = data.redirectUrl;
      } else {
        alert(data.message);
      }
    })
    .catch(err => {
      console.error(err);
      alert('로그인 처리 중 오류가 발생했습니다.');
    });
  }
</script>
</body>
</html>
